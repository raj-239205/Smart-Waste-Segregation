# Dataset configuration for YOLOv8
# Project: Smart Waste Segregation using Computer Vision

path: dataset          # root directory of the dataset
train: images/train    # training images
val: images/val        # validation images
test: images/test      # test images

# Classes
nc: 5                  # number of classes
names:
  0: plastic
  1: paper
  2: metal
  3: glass
  4: organic
